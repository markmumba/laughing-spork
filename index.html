<!doctype html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Set the theme before first paint: the saved choice, else the OS setting -->
    <script>
      (function () {
        var t
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      })()
    </script>
    <meta name="description" content="Markian Mumba Mwangi — Fullstack Developer. Building distributed systems and clean abstractions in Nairobi, Kenya." />
